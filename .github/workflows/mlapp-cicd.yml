name: NeuralEdu Predictor CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'mlapp/**'
      - '.github/workflows/mlapp-cicd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mlapp/**'
      - '.github/workflows/mlapp-cicd.yml'

jobs:
  lint-and-test:
    name: Lint & Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-and-validate-docker:
    name: Build & Validate Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: mlapp
          file: mlapp/Dockerfile
          tags: neuraledu-predictor:local
          outputs: type=docker,dest=/tmp/myimage.tar

      - name: Load Local Image
        run: |
          docker load --input /tmp/myimage.tar

      - name: Start Docker Container (Smoke Test)
        run: |
          docker run -d --name test_app -p 5000:5000 neuraledu-predictor:local
          # Wait for container to spin up and health check to pass
          echo "Waiting for app to start..."
          sleep 5

      - name: Run Smoke Test API Validation
        run: |
          # Fetch the health endpoint
          RESPONSE=$(curl --silent --fail http://localhost:5000/api/health)
          echo "Health check response: $RESPONSE"
          if [[ $RESPONSE != *"healthy"* ]]; then
            echo "Health check failed!"
            docker logs test_app
            exit 1
          fi
          
          # Test the prediction endpoint with a sample payload
          PREDICT_RESPONSE=$(curl --silent -X POST -H "Content-Type: application/json" \
            -d '{"study_time_hours": 6.0, "attendance_percent": 90.0, "sleep_hours": 8.0}' \
            http://localhost:5000/api/predict)
          echo "Predict response: $PREDICT_RESPONSE"
          if [[ $PREDICT_RESPONSE != *"predicted_score"* ]]; then
            echo "Prediction endpoint failed!"
            docker logs test_app
            exit 1
          fi

      - name: Tear Down Container
        if: always()
        run: |
          docker stop test_app || true
          docker rm test_app || true

  push-to-registry:
    name: Build & Push to Docker Hub
    needs: build-and-validate-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/neuraledu-predictor
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: mlapp
          file: mlapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
