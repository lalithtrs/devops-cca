services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: standard-ml-api:latest
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=/app/models/xgboost_v1.pkl
      - WORKERS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3